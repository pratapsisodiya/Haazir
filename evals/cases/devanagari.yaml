# Hindi in Devanagari: the reply must be in Devanagari too.
- id: deva-fee-rscit
  tags: [devanagari]
  turns:
    - user: 'आरएससीआईटी की फीस कितनी है?'
      expect:
        {
          intent: fee_query,
          language: hi,
          script: devanagari,
          must_include: ['4500'],
          handoff: false,
        }

- id: deva-tally-timing
  tags: [devanagari]
  turns:
    - user: 'टैली की क्लास कितने बजे होती है?'
      expect:
        { intent: batch_timing, script: devanagari, must_include_any: ['10', '11'], handoff: false }

